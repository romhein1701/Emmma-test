<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 26px 30px; }
  .row  { display: grid; grid-template-columns: 1.1fr 1fr; gap: 24px; margin-top: 16px; align-items: stretch; }
  .tile { border-radius: 14px; padding: 24px; display:flex; flex-direction:column; gap: 12px;
    justify-content: space-between; min-height: 160px; border: 1px solid rgba(127,127,127,0.12); }
  .tile.dark  { background: #0F0E0D; color: #F7F3F2; }
  .tile.light { background: #F5F5EE; color: #2E2928; }
  .tile.brand { background: #928617; color: #FAFAF7; border-color: transparent; }
  .mark { display: flex; align-items: center; gap: 14px; }
  .mark svg { width: 44px; height: 44px; }
  .wordmark { font: 500 32px/1 var(--font-display); letter-spacing: -0.04em; }
  .scale { display:flex; align-items: flex-end; gap: 18px; }
  .scale svg { display:block; }
  .scale .item { display:flex; flex-direction: column; align-items:center; gap: 6px; }
  .scale .px { font: 500 10px/1 var(--font-mono); color: currentColor; opacity: 0.55; }
</style></head>
