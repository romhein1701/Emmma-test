<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="_components.css">
<style>
  .card { padding: 24px 30px; }
  .grid { display: grid; grid-template-columns: auto 1fr; gap: 14px 18px; align-items: center; }
  .col-label { font: 500 11px/1 var(--font-mono); color: var(--fg-faint); letter-spacing: 0.04em; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
</style></head>
<body class="on-dark">
<div class="card">
  <div class="between" style="margin-bottom:14px"><span class="label">Buttons · Primary + Accent</span><span class="meta">Patina + Amber</span></div>
  <div class="grid">
    <span class="col-label">large</span>
    <div class="row">
      <button class="btn btn-primary btn-lg">Pre-order Emmma</button>
      <button class="btn btn-accent  btn-lg">Watch the film</button>
      <button class="btn btn-primary btn-lg" disabled>Sold out</button>
    </div>
    <span class="col-label">medium</span>
    <div class="row">
      <button class="btn btn-primary btn-md">Pre-order</button>
      <button class="btn btn-accent  btn-md">Watch demo</button>
    </div>
    <span class="col-label">small</span>
    <div class="row">
      <button class="btn btn-primary btn-sm">Reserve</button>
      <button class="btn btn-accent  btn-sm">Notify me</button>
    </div>
  </div>
</div>
</body></html>
