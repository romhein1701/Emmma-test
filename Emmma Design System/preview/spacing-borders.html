<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 14px; }
  .demo { padding: 16px; border-radius: 12px; min-height: 100px;
    display:flex; flex-direction:column; justify-content:space-between; }
  .demo.dark { background: #1A1716; }
  .demo.light { background: #F5F5EE; }
  .hr-dark  { height: 1px; background: #2E2928; }
  .hr-light { height: 1px; background: #D1CEBC; }
  .hr-edge  { height: 1px; background: #524A48; }
  .lbl { font: 500 11px/1 var(--font-mono); letter-spacing: 0.02em; }
  .lbl.dark  { color: #9E8F8A; }
  .lbl.light { color: #9E9B87; }
</style></head>
<body>
<div class="card">
  <div class="between"><span class="label">Borders · hairlines only</span><span class="meta">1 px, neutral, never branded</span></div>
  <div class="grid">
    <div class="demo dark">
      <span class="lbl dark">--border · 2E2928</span>
      <div class="hr-dark"></div>
      <span class="lbl dark">--border-strong · 524A48</span>
      <div class="hr-edge"></div>
    </div>
    <div class="demo light">
      <span class="lbl light">--border · D1CEBC</span>
      <div class="hr-light"></div>
      <span class="lbl light">--border-soft · E2E0CF</span>
      <div class="hr-light" style="background:#E2E0CF"></div>
    </div>
  </div>
</div>
</body></html>
