<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .stage { background: #FAFAF7; border-radius: 14px; padding: 30px 20px; margin-top: 14px;
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 22px; align-items: center; }
  .pad { background: #FFFFFF; border-radius: 14px; height: 100px; display:flex; flex-direction:column;
    justify-content:flex-end; padding: 12px; }
  .pad .n { font: 500 12px/1 var(--font-ui); color: #2E2928; }
  .pad .v { font: 500 10px/1 var(--font-mono); color: #9E9B87; margin-top: 4px; }
  .e1 { box-shadow: 0 1px 2px 0 rgba(23,23,23,0.05); border: 1px solid rgba(46,41,40,0.04);}
  .e2 { box-shadow: 0 4px 12px -2px rgba(15,14,13,0.12), 0 2px 4px -2px rgba(15,14,13,0.08);}
  .e3 { box-shadow: 0 18px 48px -12px rgba(15,14,13,0.45), 0 4px 12px -4px rgba(15,14,13,0.35);}
  .label { color: #524A48; }
  .meta { color: #9E9B87; }
  .card { background: #F5F5EE; color: #2E2928; }
</style></head>
<body>
<div class="card">
  <div class="between"><span class="label">Elevation · 2-stop system</span><span class="meta">Resting + Focus only</span></div>
  <div class="stage">
    <div class="pad e1"><span class="n">elev-1</span><span class="v">resting card</span></div>
    <div class="pad e2"><span class="n">elev-2</span><span class="v">menu / toast</span></div>
    <div class="pad e3"><span class="n">elev-3</span><span class="v">capsule focus</span></div>
  </div>
</div>
</body></html>
