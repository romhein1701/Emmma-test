<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 24px 32px 28px; }
  .display-line {
    font-family: var(--font-display); font-weight: 500;
    font-size: 96px; line-height: 1.04; letter-spacing: -0.05em;
    color: var(--fg); margin: 0;
  }
  .h1-line {
    font-family: var(--font-display); font-weight: 500;
    font-size: 64px; line-height: 1.06; letter-spacing: -0.045em;
    color: var(--fg); margin: 0;
  }
  .meta-row { display: flex; gap: 18px; margin-top: 14px; }
  .meta-row .meta { color: var(--fg-faint); }
</style></head>
<body>
<div class="card">
  <div class="between" style="margin-bottom:8px">
    <span class="label">Display · Archivo Medium</span>
    <span class="meta">96 / 100 · −5%</span>
  </div>
  <p class="display-line">Capsules</p>
  <div class="between" style="margin-top:18px;margin-bottom:6px">
    <span class="label">H1 · Archivo Medium</span>
    <span class="meta">64 / 68 · −4.5%</span>
  </div>
  <p class="h1-line">Memories you can hold</p>
</div>
</body></html>
