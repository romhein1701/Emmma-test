<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .row-spec { display: grid; grid-template-columns: 1fr auto; align-items: baseline;
    gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--border-soft); }
  .row-spec:last-child { border-bottom: none; }
  .h2-line { font-family: var(--font-display); font-weight:500;
    font-size: 40px; line-height: 1.12; letter-spacing: -0.035em; color: var(--fg); margin: 0; }
  .h3-line { font-family: var(--font-display); font-weight:500;
    font-size: 32px; line-height: 1.18; letter-spacing: -0.030em; color: var(--fg); margin: 0; }
  .h4-line { font-family: var(--font-display); font-weight:500;
    font-size: 20px; line-height: 1.4; letter-spacing: -0.020em; color: var(--fg); margin: 0; }
</style></head>
<body>
<div class="card">
  <div class="row-spec">
    <p class="h2-line">Stays on your shelf, not their servers</p>
    <span class="meta">H2 · 40 / 45</span>
  </div>
  <div class="row-spec">
    <p class="h3-line">La Rochelle · 07.2026</p>
    <span class="meta">H3 · 32 / 38</span>
  </div>
  <div class="row-spec">
    <p class="h4-line">132 archives, all local</p>
    <span class="meta">H4 · 20 / 28</span>
  </div>
</div>
</body></html>
