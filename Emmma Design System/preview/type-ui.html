<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 28px; }
  .ui    { font-family: var(--font-ui); font-weight: 500; font-size: 16px; line-height: 1.5; letter-spacing: -0.005em; color: var(--fg); }
  .small { font: 500 14px/1.42 var(--font-body); color: var(--fg-muted); }
  .cap   { font: 500 12px/1.6 var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-subtle); }
  .mono  { font: 500 14px/1.55 var(--font-mono); color: var(--patina-300); font-variant-numeric: tabular-nums; }
  .cell  { display:flex; flex-direction:column; gap:6px; }
</style></head>
<body>
<div class="card">
  <div class="grid">
    <div class="cell">
      <div class="ui">Show my souvenir</div>
      <span class="meta">UI · Inter / Archivo Medium 16</span>
    </div>
    <div class="cell">
      <div class="small">Shared with Romain</div>
      <span class="meta">Small · Archivo Medium 14</span>
    </div>
    <div class="cell">
      <div class="cap">New release · 2026</div>
      <span class="meta">Caption · Archivo Medium 12</span>
    </div>
    <div class="cell">
      <div class="mono">1.2 TB · 132 ARCH · 04:12</div>
      <span class="meta">Mono · JetBrains Mono 14</span>
    </div>
  </div>
</div>
</body></html>
